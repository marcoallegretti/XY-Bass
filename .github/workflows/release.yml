name: release

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-2022 }
          - { name: macOS,   os: macos-14 }
          - { name: Linux,   os: ubuntu-24.04 }

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev

      - name: Install Ninja
        if: runner.os != 'Linux'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Use MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      # A tag names the release; anything else is a dry run that still exercises
      # every signing step so the pipeline cannot rot between releases.
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            LABEL="${GITHUB_REF_NAME#v}"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            LABEL="0.0.0"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

          # CMake and JUCE only accept a numeric version, so a tag like 0.9.0-rc1
          # builds as 0.9.0 while the release and its files keep the full label.
          NUM="${LABEL%%-*}"
          [[ "$NUM" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]] || { echo "::error::tag $LABEL has no numeric version"; exit 1; }
          if [ "$LABEL" != "$NUM" ]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

          echo "version=$NUM" >> "$GITHUB_OUTPUT"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "building $LABEL (binary version $NUM)"

      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" == "macOS" ]; then
            EXTRA='-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0'
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DXYBASS_VERSION="${{ steps.ver.outputs.version }}" $EXTRA

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 900 -LE performance

      - name: Collect bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          FOUND=0
          for ext in vst3 component clap; do
            while IFS= read -r -d '' b; do
              cp -R "$b" dist/
              FOUND=$((FOUND + 1))
            done < <(find build/XYBass_artefacts/Release -maxdepth 2 -name "*.$ext" -print0 2>/dev/null)
          done
          [ "$FOUND" -gt 0 ] || { echo "::error::no bundles built"; exit 1; }
          ls -1 dist

      - name: Verify macOS bundles are universal
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          for b in dist/*.vst3 dist/*.component dist/*.clap; do
            [ -e "$b" ] || continue
            BIN="$(find "$b/Contents/MacOS" -type f | head -1)"
            echo "$b -> $(lipo -archs "$BIN")"
            lipo -archs "$BIN" | grep -q x86_64 || { echo "::error::$b is not universal"; exit 1; }
            lipo -archs "$BIN" | grep -q arm64  || { echo "::error::$b is not universal"; exit 1; }
          done

      - name: Import signing certificates
        if: runner.os == 'macOS' && env.P12 != ''
        env:
          P12: ${{ secrets.MACOS_APPLICATION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_APPLICATION_P12_PASSWORD }}
          INSTALLER_P12: ${{ secrets.MACOS_INSTALLER_P12_BASE64 }}
          INSTALLER_PASSWORD: ${{ secrets.MACOS_INSTALLER_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"

          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/app.p12"
          security import "$RUNNER_TEMP/app.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          if [ -n "$INSTALLER_P12" ]; then
            printf '%s' "$INSTALLER_P12" | base64 --decode > "$RUNNER_TEMP/inst.p12"
            security import "$RUNNER_TEMP/inst.p12" -k "$KEYCHAIN" -P "$INSTALLER_PASSWORD" -T /usr/bin/productsign
            rm -f "$RUNNER_TEMP/inst.p12"
          fi
          rm -f "$RUNNER_TEMP/app.p12"

          security set-key-partition-list -S apple-tool:,apple:,codesign:,productsign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          APP_ID="$(security find-identity -v "$KEYCHAIN" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          INS_ID="$(security find-identity -v "$KEYCHAIN" | awk -F'"' '/Developer ID Installer/ {print $2; exit}')"
          [ -n "$APP_ID" ] || { echo "::error::no Developer ID Application identity"; exit 1; }
          echo "APP_ID=$APP_ID" >> "$GITHUB_ENV"
          echo "INS_ID=$INS_ID" >> "$GITHUB_ENV"
          echo "application: $APP_ID"
          echo "installer  : ${INS_ID:-none}"

      - name: Sign bundles
        if: runner.os == 'macOS' && env.APP_ID != ''
        run: |
          set -euo pipefail
          for b in dist/*; do
            codesign --force --sign "$APP_ID" --keychain "$KEYCHAIN" \
              --options runtime --timestamp "$b"
            codesign --verify --deep --strict --verbose=2 "$b"
          done

      # The installer certificate exists, so ship the format macOS users expect
      # rather than asking them to place bundles by hand.
      - name: Build installer package
        if: runner.os == 'macOS' && env.INS_ID != ''
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          mkdir -p pkg
          COMPONENTS=()

          build_component () {
            local bundle="$1" dest="$2" name="$3"
            [ -e "$bundle" ] || return 0
            local root="$RUNNER_TEMP/root-$name"
            rm -rf "$root"; mkdir -p "$root"
            cp -R "$bundle" "$root/"
            pkgbuild --root "$root" --install-location "$dest" \
                     --identifier "com.23dsp.xybass.$name" --version "$V" "pkg/$name.pkg"
            COMPONENTS+=("pkg/$name.pkg")
          }

          build_component "dist/XY Bass.vst3"      /Library/Audio/Plug-Ins/VST3       vst3
          build_component "dist/XY Bass.component" /Library/Audio/Plug-Ins/Components au
          build_component "dist/XY Bass.clap"      /Library/Audio/Plug-Ins/CLAP       clap

          [ ${#COMPONENTS[@]} -gt 0 ] || { echo "::error::no installer components"; exit 1; }

          productbuild --synthesize $(printf -- '--package %s ' "${COMPONENTS[@]}") pkg/distribution.xml
          productbuild --distribution pkg/distribution.xml --package-path pkg \
                       "pkg/XY Bass-unsigned.pkg"
          # pkgbuild takes the numeric version so installers compare correctly, but
          # the file the user downloads must carry the release label.
          PKG="dist/XY Bass-${{ steps.ver.outputs.label }}.pkg"
          productsign --sign "$INS_ID" --keychain "$KEYCHAIN" \
                      "pkg/XY Bass-unsigned.pkg" "$PKG"
          pkgutil --check-signature "$PKG"

      - name: Notarize and staple
        if: runner.os == 'macOS' && env.APP_ID != '' && env.APPLE_APP_PASSWORD != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          submit () {
            xcrun notarytool submit "$1" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" --wait --timeout 30m
          }

          PKG="$(find dist -maxdepth 1 -name '*.pkg' | head -1)"
          if [ -n "$PKG" ]; then
            submit "$PKG"
            xcrun stapler staple "$PKG"
            xcrun stapler validate "$PKG"
          fi

          ditto -c -k --keepParent --sequesterRsrc dist "$RUNNER_TEMP/bundles.zip"
          submit "$RUNNER_TEMP/bundles.zip"
          for b in dist/*.vst3 dist/*.component dist/*.clap; do
            [ -e "$b" ] || continue
            xcrun stapler staple "$b"
            xcrun stapler validate "$b"
          done

      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.label }}"
          NAME="XY-Bass-$V-${{ matrix.name }}"
          mkdir -p out
          case "$RUNNER_OS" in
            # ditto keeps bundle structure and symlinks intact; plain zip does not.
            macOS)   ditto -c -k --sequesterRsrc dist "out/$NAME.zip" ;;
            Windows) 7z a -tzip -bso0 "out/$NAME.zip" ./dist/* ;;
            *)       ( cd dist && zip -qry "../out/$NAME.zip" . ) ;;
          esac
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: XY-Bass-${{ matrix.name }}
          path: out/
          if-no-files-found: error

  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          find assets -type f -name '*.zip' -exec ls -la {} \;
          # A tag carrying a suffix is a pre-release, so GitHub must not offer it
          # to users as the current version.
          FLAGS=(--generate-notes)
          case "$GITHUB_REF_NAME" in
            *-*) FLAGS+=(--prerelease) ;;
          esac

          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "XY Bass $GITHUB_REF_NAME" \
            "${FLAGS[@]}" \
            $(find assets -type f -name '*.zip' -print)
